<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>Minimal Chat</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Minimal Chat home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>little chat</span>
        </a>
        <div class="model-tag"><span class="status-dot"></span> Groq · Llama 3.3</div>
      </header>

      <section class="chat" aria-label="Chat conversation">
        <div class="welcome" id="welcome">
          <div class="welcome-icon" aria-hidden="true">✳</div>
          <p class="eyebrow">A little space to think</p>
          <h1>What’s on your mind?</h1>
          <p class="welcome-copy">Ask a question, untangle an idea, or just say hello.</p>
          <div class="suggestions">
            <button class="suggestion" type="button">Help me plan my week <span>↗</span></button>
            <button class="suggestion" type="button">Explain something simply <span>↗</span></button>
            <button class="suggestion" type="button">Give me a fresh idea <span>↗</span></button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <form class="composer" id="chat-form">
        <label class="sr-only" for="prompt">Message</label>
        <textarea id="prompt" rows="1" placeholder="Message little chat…" autocomplete="off" required></textarea>
        <div class="composer-bottom">
          <span class="hint">Enter to send · Shift + Enter for a new line</span>
          <button class="send-button" id="send-button" type="submit" aria-label="Send message">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15V5m0 0L5.5 9.5M10 5l4.5 4.5" /></svg>
          </button>
        </div>
      </form>
      <footer>Made for the small and big questions.</footer>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
